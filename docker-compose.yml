services:
  postgres:
    image: postgres:16
    container_name: ai-model-router-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_model_router
    ports:
      - "5432:5432"
    volumes:
      - ai_model_router_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_model_router"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ai_model_router_pgdata:
